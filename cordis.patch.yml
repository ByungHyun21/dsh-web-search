- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: lemoncat7-search
    fetchProvider: lemoncat7-search

- insert:
    - id: lemoncat7-web-search
      name: '@lemoncat7/dsh-web-search'
      config:
        provider: searxng
        searxng:
          baseURL: http://127.0.0.1:8080
          language: ko
          engines: ['google cse', yandex, naver]
          retryCount: 1
          safeSearch: 1
